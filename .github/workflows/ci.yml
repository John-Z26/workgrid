name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run logic regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Install browser for UI regression tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile UI regression tests
        run: npm run test:ui
      - name: ICS timetable converter regression tests
        run: node tests/ics-workgrid-regression.cjs
